
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DESIGNATION: COOL</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      {
        "imports": {
          "@microsoft/power-apps/data": "./power-apps-data.js"
        }
      }
    </script>
  </head>
  <body>

    <div id="root">
      <!-- Loading Screen -->
      <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Accessing dossier …</div>
      </div>

      <!-- Error Banner -->
      <div class="error-banner" id="errorBanner"></div>

      <!-- Top Bar -->
      <div class="topbar">
        <span>Dossier // <span class="topbar-accent">Active</span></span>
        <span>Clearance: Everyone</span>
      </div>

      <!-- Main Content -->
      <div class="main">
        <div class="card">
          <div class="card-header">
            <div class="card-id">Subject #001</div>
            <div class="card-badge">Confirmed Cool</div>
          </div>
          <div class="card-body">

            <!-- Profile Row: photo + name -->
            <div class="profile-row">
              <div class="profile-photo-wrapper" id="photoContainer">
                <div class="profile-photo-ring"></div>
                <div class="profile-photo-fallback" id="photoFallback">J</div>
              </div>
              <div class="profile-text">
                <div class="subject-name"><strong id="firstName">Jack</strong> is cool.</div>
                <div class="subject-title" id="jobTitle">Loading…</div>
              </div>
            </div>

            <!-- Coolness Bar -->
            <div class="cool-bar">
              <div class="cool-bar-label">Coolness Index</div>
              <div class="cool-bar-track">
                <div class="cool-bar-fill"></div>
              </div>
              <div class="cool-bar-val">MAXED</div>
            </div>

            <!-- Attributes -->
            <div class="attributes">
              <div class="attr">
                <div class="attr-label">Status</div>
                <div class="attr-value" id="attrStatus">Undeniably Cool</div>
              </div>
              <div class="attr">
                <div class="attr-label">Department</div>
                <div class="attr-value" id="attrDepartment">—</div>
              </div>
              <div class="attr">
                <div class="attr-label">Office</div>
                <div class="attr-value" id="attrOffice">—</div>
              </div>
              <div class="attr">
                <div class="attr-label">Threat Level</div>
                <div class="attr-value">Too Cool</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Bar -->
      <div class="bottombar">This message has been approved by the coolness authority</div>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
